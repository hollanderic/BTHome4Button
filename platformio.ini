; PlatformIO Project Configuration File
; BTHome v2 4-Button Low-Power BLE Device (nRF52832)

[platformio]
default_envs = pca10040

[env]
framework = arduino
monitor_speed = 115200

[env:pca10040]
platform = nordicnrf52
board = nrf52_dk
upload_protocol = jlink
debug_tool = jlink
build_flags =
    -DBOARD_PCA10040
    -Wall
    -Wextra
    -Os

[env:custom_pcb]
platform = nordicnrf52
board = nrf52_dk
upload_protocol = jlink
debug_tool = jlink
build_flags =
    -DBOARD_CUSTOM_PCB
    -Wall
    -Wextra
    -Os

[env:picomicro_nrf52840]
platform = nordicnrf52
board = adafruit_feather_nrf52840
upload_protocol = nrfutil
build_flags =
    -DBOARD_PICOMICRO_NRF52840
    -Wall
    -Wextra
    -Os

[env:native]
platform = native
framework =
test_build_src = no
build_flags =
    -std=c++17
    -Iinclude
    -Wall
    -Wextra

